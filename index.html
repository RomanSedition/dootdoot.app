<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doot² · Coming soon</title>
<meta name="description" content="Doot². Coming soon to Android.">
<meta name="theme-color" content="#0F1514">
<meta property="og:title" content="Doot²">
<meta property="og:description" content="Coming soon to Android.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230F1514'/%3E%3Ctext x='31' y='47' font-family='Trebuchet MS,sans-serif' font-weight='800' font-size='42' text-anchor='middle' fill='%23FF8452'%3ED%3C/text%3E%3Ctext x='50' y='26' font-family='Trebuchet MS,sans-serif' font-weight='800' font-size='18' fill='%2363E3C8'%3E2%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1514;--fg:#E8F1EF;--muted:#9FB3AF;
    --mint:#63E3C8;--orange:#FF8452;
    --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
    --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.55;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
    min-height:100svh;padding:32px 16px;text-align:center}
  /* the wordmark: orange, with the oo in mint, as in the app's logo */
  h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(56px,16vw,96px);line-height:1;color:var(--orange);letter-spacing:-.01em}
  h1 .oo{color:var(--mint)}
  h1 sup{font-size:.42em;vertical-align:.95em;margin-left:.04em}
  .tag{margin:0;font-size:clamp(18px,4.6vw,22px);font-weight:500;max-width:28ch}
  .soon{display:inline-block;margin:0;padding:8px 16px;border-radius:999px;border:1px solid rgba(99,227,200,.35);
    color:var(--mint);font-weight:500;font-size:15px}
  .contact{margin:0;color:var(--muted);font-size:15px}
  a{color:var(--fg);text-decoration-color:rgba(232,241,239,.4);text-underline-offset:3px}
  a:hover{text-decoration-color:var(--fg)}
  footer{color:var(--muted);font-size:13px;margin-top:8px}
</style>
</head>
<body>
  <h1>D<span class="oo">oo</span>t<sup>2</sup></h1>
  <p class="tag">Doot doot! Something’s on its way.</p>
  <p class="soon">Coming soon to Android</p>
  <p class="contact">Say hello: <a href="mailto:hello@dootdoot.app">hello@dootdoot.app</a></p>
  <footer>© 2026 Doot². All rights reserved.</footer>
</body>
</html>

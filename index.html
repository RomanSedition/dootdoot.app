<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doot² · Coming soon</title>
<meta name="description" content="Doot², a little robot friend for your phone. Coming soon to Android.">
<meta name="theme-color" content="#0F1514">
<meta property="og:title" content="Doot²">
<meta property="og:description" content="A little robot friend for your phone. Coming soon to Android.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230D1720'/%3E%3Crect x='14' y='18' width='13' height='22' rx='6.5' fill='%2363E3C8'/%3E%3Crect x='37' y='18' width='13' height='22' rx='6.5' fill='%2363E3C8'/%3E%3Cpath d='M24 47q8 6 16 0' stroke='%2363E3C8' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1514;--fg:#E8F1EF;--muted:#9FB3AF;--screen:#0D1720;
    --mint:#63E3C8;--orange:#FF8452;
    --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
    --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.55;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
    min-height:100svh;padding:32px 16px;text-align:center}
  /* Doot's face, on its LED screen */
  .screen{width:min(64vw,260px);aspect-ratio:1;border-radius:22%;position:relative;overflow:hidden;
    background:var(--screen) radial-gradient(circle,rgba(140,190,200,.09) 32%,transparent 36%) 0 0/8px 8px;
    box-shadow:0 18px 60px rgba(99,227,200,.10),inset 0 0 0 1px rgba(255,255,255,.04)}
  .face{position:absolute;inset:0;filter:drop-shadow(0 0 10px rgba(99,227,200,.55));animation:look 7s ease-in-out infinite}
  .eye{position:absolute;top:28%;width:18%;height:32%;border-radius:999px;background:var(--mint);
    transform-origin:50% 55%;animation:blink 4.6s infinite}
  .eye.l{left:24%}.eye.r{right:24%}
  .smile{position:absolute;left:50%;top:68%;width:22%;height:9%;transform:translateX(-50%);
    border:solid var(--mint);border-width:0 0 clamp(4px,1.6vw,7px);border-radius:0 0 999px 999px}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  @keyframes look{0%,38%,100%{transform:none}45%,58%{transform:translateX(-5%)}65%,78%{transform:translateX(5%)}}
  /* the wordmark: orange, with the oo in mint, as in the app's logo */
  h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(56px,16vw,96px);line-height:1;color:var(--orange);letter-spacing:-.01em}
  h1 .oo{color:var(--mint)}
  h1 sup{font-size:.42em;vertical-align:.95em;margin-left:.04em}
  .tag{margin:0;font-size:clamp(18px,4.6vw,22px);font-weight:500;max-width:28ch}
  .soon{display:inline-block;margin:0;padding:8px 16px;border-radius:999px;border:1px solid rgba(99,227,200,.35);
    color:var(--mint);font-weight:500;font-size:15px}
  .contact{margin:0;color:var(--muted);font-size:15px}
  a{color:var(--fg);text-decoration-color:rgba(232,241,239,.4);text-underline-offset:3px}
  a:hover{text-decoration-color:var(--fg)}
  footer{color:var(--muted);font-size:13px;margin-top:8px}
  @media (prefers-reduced-motion:reduce){.face,.eye{animation:none}}
</style>
</head>
<body>
  <div class="screen" role="img" aria-label="Doot’s face, smiling and blinking">
    <div class="face"><span class="eye l"></span><span class="eye r"></span><span class="smile"></span></div>
  </div>
  <h1>D<span class="oo">oo</span>t<sup>2</sup></h1>
  <p class="tag">A little robot friend for your phone.</p>
  <p class="soon">Coming soon to Android</p>
  <p class="contact">Say hello: <a href="mailto:hello@dootdoot.app">hello@dootdoot.app</a></p>
  <footer>© 2026 Doot². All rights reserved.</footer>
</body>
</html>
